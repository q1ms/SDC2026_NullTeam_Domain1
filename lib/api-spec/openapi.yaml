openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: Career insight operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /career-insights:
    post:
      operationId: generateCareerInsights
      tags: [career]
      summary: Generate AI career recommendations
      description: Generates personalized role and reskilling recommendations from user skills, role trend data, and the selected disruption scenario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerInsightsInput"
      responses:
        "200":
          description: Personalized career recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerInsights"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: AI provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareerRole:
      type: object
      properties:
        title:
          type: string
        growth:
          type: number
        skills:
          type: array
          items:
            type: string
        sdgs:
          type: array
          items:
            type: string
      required: [title, growth, skills, sdgs]
    CareerInsightsInput:
      type: object
      properties:
        skills:
          type: array
          minItems: 1
          items:
            type: string
        scenario:
          type: string
          enum: [moderate, fast]
        roles:
          type: array
          items:
            $ref: "#/components/schemas/CareerRole"
      required: [skills, scenario, roles]
    CareerInsights:
      type: object
      properties:
        summary:
          type: string
        recommendedRoles:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              rationale:
                type: string
              nextSkills:
                type: array
                items:
                  type: string
            required: [title, rationale, nextSkills]
      required: [summary, recommendedRoles]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

