openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: Career profiles, job roles, and sustainable-development skills
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCareerProfile
      tags: [career]
      summary: Get a saved career profile
      responses:
        "200":
          description: Career profile, or null when the browser has not saved one
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CareerProfile"
                  - type: "null"
    put:
      operationId: saveCareerProfile
      tags: [career]
      summary: Create or update a career profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerProfileInput"
      responses:
        "200":
          description: Saved career profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfile"
  /roles:
    get:
      operationId: listJobRoles
      tags: [career]
      summary: List reskilling roles
      responses:
        "200":
          description: Available job roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRole"
  /sdgs/skills:
    get:
      operationId: listSdgSkillMappings
      tags: [career]
      summary: List UN SDG skill mappings
      responses:
        "200":
          description: The 17 Sustainable Development Goals and their mapped skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SdgSkillMapping"
  /trends:
    get:
      operationId: getLiveTrends
      tags: [career]
      summary: Get five current AI topics from recent news coverage
      responses:
        "200":
          description: Five current AI topics with source articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTrendsResponse"
        "502":
          description: The public news feed is unavailable or returned no usable articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currentRole:
          type: string
        yearsExperience:
          type: integer
        industry:
          type: string
        skills:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        weeklyHours:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - currentRole
        - yearsExperience
        - industry
        - skills
        - interests
        - weeklyHours
        - updatedAt
    CareerProfileInput:
      type: object
      properties:
        currentRole:
          type: string
          minLength: 1
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 60
        industry:
          type: string
          minLength: 1
        skills:
          type: array
          minItems: 1
          items:
            type: string
        interests:
          type: array
          minItems: 1
          items:
            type: string
        weeklyHours:
          type: integer
          minimum: 1
          maximum: 80
      required:
        - currentRole
        - yearsExperience
        - industry
        - skills
        - interests
        - weeklyHours
    JobRole:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        salary:
          type: string
        timeToReady:
          type: string
        skills:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - description
        - salary
        - timeToReady
        - skills
        - steps
    SdgSkillMapping:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 17
        title:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
      required:
        - number
        - title
        - description
        - skills
    LiveTrend:
      type: object
      properties:
        topic:
          type: string
        mentions:
          type: integer
          minimum: 1
        headline:
          type: string
        summary:
          type: string
        sourceName:
          type: string
        articleUrl:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
      required:
        - topic
        - mentions
        - headline
        - summary
        - sourceName
        - articleUrl
        - publishedAt
    LiveTrendsResponse:
      type: object
      properties:
        source:
          type: string
        feedUrl:
          type: string
          format: uri
        fetchedAt:
          type: string
          format: date-time
        trends:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/LiveTrend"
      required:
        - source
        - feedUrl
        - fetchedAt
        - trends

