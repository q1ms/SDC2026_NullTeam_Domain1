openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: Career profiles, job roles, and sustainable-development skills
paths:
  /career-evidence:
    get:
      operationId: getCareerEvidence
      tags: [career]
      responses:
        "200":
          description: Curated public evidence and bounded live-news mappings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSnapshot"
  /pathway-demo:
    get:
      operationId: getPathwayDemo
      tags: [career]
      responses:
        "200":
          description: Read-only deterministic sample; never saves over a personal profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPathway"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCareerProfile
      tags: [career]
      summary: Get a saved career profile
      responses:
        "200":
          description: Career profile, or null when the browser has not saved one
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CareerProfile"
                  - type: "null"
    put:
      operationId: saveCareerProfile
      tags: [career]
      summary: Create or update a career profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerProfileInput"
      responses:
        "200":
          description: Saved career profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerProfile"
  /profiles/{profileId}/pathway:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getGeneratedPathway
      tags: [career]
      summary: Get the latest generated pathway for a career profile
      responses:
        "200":
          description: Saved pathway, or null when one has not been generated
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GeneratedPathway"
                  - type: "null"
  /roles:
    get:
      operationId: listJobRoles
      tags: [career]
      summary: List reskilling roles
      responses:
        "200":
          description: Available job roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRole"
  /generate-pathway:
    post:
      operationId: generatePathway
      tags: [career]
      summary: Recommend career pathways from a user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathwayGenerationInput"
      responses:
        "200":
          description: Generated pathway saved for the supplied profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPathway"
        "400":
          description: Invalid career profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Career profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Profile changed while evidence was loading
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sdgs/skills:
    get:
      operationId: listSdgSkillMappings
      tags: [career]
      summary: List UN SDG skill mappings
      responses:
        "200":
          description: The 17 Sustainable Development Goals and their mapped skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SdgSkillMapping"
  /trends:
    get:
      operationId: getLiveTrends
      tags: [career]
      summary: Get five current AI topics from recent news coverage
      responses:
        "200":
          description: Five current AI topics with source articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveTrendsResponse"
        "502":
          description: The public news feed is unavailable or returned no usable articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currentRole:
          type: string
        yearsExperience:
          type: integer
        industry:
          type: string
        skills:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        weeklyHours:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - currentRole
        - yearsExperience
        - industry
        - skills
        - interests
        - weeklyHours
        - updatedAt
    CareerProfileInput:
      type: object
      properties:
        currentRole:
          type: string
          minLength: 1
        yearsExperience:
          type: integer
          minimum: 0
          maximum: 60
        industry:
          type: string
          minLength: 1
        skills:
          type: array
          minItems: 1
          items:
            type: string
        interests:
          type: array
          minItems: 1
          items:
            type: string
        weeklyHours:
          type: integer
          minimum: 1
          maximum: 80
      required:
        - currentRole
        - yearsExperience
        - industry
        - skills
        - interests
        - weeklyHours
    PathwayGenerationInput:
      type: object
      properties:
        profileId:
          type: string
          format: uuid
        profile:
          $ref: "#/components/schemas/CareerProfileInput"
      required:
        - profileId
        - profile
    JobRole:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        salary:
          type: string
        timeToReady:
          type: string
        skills:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - description
        - salary
        - timeToReady
        - skills
        - steps
    ReskillingStep:
      type: object
      additionalProperties: false
      properties:
        step:
          type: string
          minLength: 1
        estimatedHours:
          type: integer
          minimum: 1
          maximum: 200
        resourceLink:
          type: string
          description: Direct curated learning resource; legacy pathways may omit this.
        resourceTitle:
          type: string
        cost:
          type: string
        checkedAt:
          type: string
      required:
        - step
        - estimatedHours
    PathwayScenario:
      type: object
      additionalProperties: false
      properties:
        roleTitle:
          type: string
          minLength: 1
        evidenceIds:
          type: array
          items:
            type: string
        scoreBasis:
          type: string
        matchedSkills:
          type: array
          items:
            type: string
        paceEstimate:
          type: string
        matchScore:
          type: integer
          minimum: 1
          maximum: 100
        explainableReason:
          type: string
          minLength: 1
          maxLength: 500
        skillsGap:
          type: array
          items:
            type: string
        reskillingPathway:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/ReskillingStep"
        unSdgTag:
          type: string
          enum:
            - "SDG 1: No Poverty"
            - "SDG 2: Zero Hunger"
            - "SDG 3: Good Health and Well-Being"
            - "SDG 4: Quality Education"
            - "SDG 5: Gender Equality"
            - "SDG 6: Clean Water and Sanitation"
            - "SDG 7: Affordable and Clean Energy"
            - "SDG 8: Decent Work and Economic Growth"
            - "SDG 9: Industry, Innovation and Infrastructure"
            - "SDG 10: Reduced Inequalities"
            - "SDG 11: Sustainable Cities and Communities"
            - "SDG 12: Responsible Consumption and Production"
            - "SDG 13: Climate Action"
            - "SDG 14: Life Below Water"
            - "SDG 15: Life on Land"
            - "SDG 16: Peace, Justice and Strong Institutions"
            - "SDG 17: Partnerships for the Goals"
      required:
        - roleTitle
        - matchScore
        - explainableReason
        - skillsGap
        - reskillingPathway
        - unSdgTag
    PathwayGenerationOutput:
      type: object
      additionalProperties: false
      properties:
        scenarios:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/PathwayScenario"
      required:
        - scenarios
    GeneratedPathway:
      type: object
      additionalProperties: false
      properties:
        profileId:
          type: string
          format: uuid
        scenarios:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/PathwayScenario"
        generatedAt:
          type: string
          format: date-time
        analysis:
          $ref: "#/components/schemas/PathwayAnalysis"
      required:
        - profileId
        - scenarios
        - generatedAt
    CareerSignal:
      type: object
      required: [id, title, source, url, publishedAt, fetchedAt, scope, kind, limitation, roleIds, skills, weight]
      properties:
        id:
          type: string
        title:
          type: string
        source:
          type: string
        url:
          type: string
        publishedAt:
          type: string
        fetchedAt:
          type: string
        scope:
          type: string
        kind:
          type: string
          enum: [labor-market, employer-survey, policy, news]
        limitation:
          type: string
        roleIds:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        weight:
          type: integer
          minimum: 0
          maximum: 4
    EvidenceSnapshot:
      type: object
      required: [signals, newsStatus, fetchedAt]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/CareerSignal"
        newsStatus:
          type: string
        fetchedAt:
          type: string
    AdoptionComparison:
      type: object
      required: [id, name, assumptions, scenarios]
      properties:
        id:
          type: string
          enum: [moderate, fast]
        name:
          type: string
        assumptions:
          type: string
        scenarios:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/PathwayScenario"
    PathwayAnalysis:
      type: object
      required: [model, limitations, evidence, comparisons, profileSummary]
      properties:
        model:
          type: string
        limitations:
          type: string
        profileSummary:
          type: string
        evidence:
          $ref: "#/components/schemas/EvidenceSnapshot"
        comparisons:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/AdoptionComparison"
    SdgSkillMapping:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 17
        title:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
      required:
        - number
        - title
        - description
        - skills
    LiveTrend:
      type: object
      properties:
        topic:
          type: string
        mentions:
          type: integer
          minimum: 1
        headline:
          type: string
        summary:
          type: string
        sourceName:
          type: string
        articleUrl:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
      required:
        - topic
        - mentions
        - headline
        - summary
        - sourceName
        - articleUrl
        - publishedAt
    LiveTrendsResponse:
      type: object
      properties:
        source:
          type: string
        feedUrl:
          type: string
          format: uri
        fetchedAt:
          type: string
          format: date-time
        trends:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/LiveTrend"
      required:
        - source
        - feedUrl
        - fetchedAt
        - trends

