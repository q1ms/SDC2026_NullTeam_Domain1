kind = "web"
previewPath = "/"
title = "Career Reskilling Dashboard"
description = "A career reskilling dashboard where users describe their experience, explore AI-related job skill trends, and get personalized role recommendations with practical learning pathways."
version = "1.0.0"
id = "artifacts/career-reskill"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25299

[services.development]
run = "pnpm --filter @workspace/career-reskill run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-reskill", "run", "build" ]
serve = "static"
publicDir = "artifacts/career-reskill/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25299"
BASE_PATH = "/"
